<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bin2bmp 3D viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0e; color: #ddd; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  #ui { position: absolute; top: 12px; left: 12px; bottom: 12px; width: 300px; box-sizing: border-box; overflow-y: auto;
        background: rgba(20,20,26,.88); border: 1px solid #333; border-radius: 8px; padding: 12px; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  h2 { font-size: 12px; margin: 14px 0 6px; color: #999; text-transform: uppercase; letter-spacing: .05em; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  button, select { background: #222; color: #ddd; border: 1px solid #444; border-radius: 5px; padding: 5px 9px; cursor: pointer; font: inherit; }
  button.on { background: #2b5cff; border-color: #2b5cff; color: #fff; }
  label { display: block; margin-top: 8px; }
  input[type=range] { width: 100%; }
  #about { color: #bbb; margin: 6px 0; min-height: 3.6em; }
  #info { margin-top: 8px; color: #999; white-space: pre-line; }
  .file { display: flex; gap: 8px; align-items: center; padding: 5px; margin: 4px 0; border: 1px solid #333; border-radius: 6px; cursor: pointer; }
  .file.on { border-color: #2b5cff; background: rgba(43,92,255,.15); }
  .file canvas { width: 56px; height: 56px; flex: none; background: #000; border-radius: 3px; image-rendering: pixelated; }
  .file .meta { flex: 1; min-width: 0; }
  .file .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file .sub { color: #888; font-size: 12px; }
  .file .remove { padding: 0 6px; border: 0; background: none; color: #888; font-size: 16px; }
  #legend { position: absolute; bottom: 12px; left: 324px; font-size: 12px; }
  #legend span { margin-right: 14px; }
  #drop { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; font-size: 22px;
          background: rgba(43,92,255,.2); border: 3px dashed #2b5cff; pointer-events: none; }
</style>
</head>
<body>
<aside id="ui">
  <h1>3D byte graphs</h1>
  <div class="row" id="modes"></div>
  <div id="about"></div>
  <label>Colour
    <select id="colour">
      <option value="count">how often it occurs</option>
      <option value="where">where in the file it first occurs</option>
    </select>
  </label>
  <label>Point size <input type="range" id="size" min="1" max="8" step="0.5" value="2"></label>
  <label>Hide rare (min count) <input type="range" id="min" min="1" max="50" value="1"></label>
  <div class="row">
    <button id="rot" class="on">Auto-rotate</button>
    <button id="open">Open files…</button>
    <input type="file" id="file" multiple hidden>
  </div>
  <div id="info"></div>
  <h2>Files</h2>
  <div id="files"></div>
</aside>
<div id="legend"></div>
<div id="drop">Drop files to graph them</div>

<script id="pure">
// No DOM in this block: viewer/test.js runs it in node.
const SLICES = 256;
const MODES = {
  tri: {
    label: "Trigraph",
    about: "Every three neighbouring bytes are one point in the cube.",
    axes: ["byte i", "byte i+1", "byte i+2"],
  },
  height: {
    label: "Digraph + height",
    about: "The flat digraph, with every pair raised by how often it occurs.",
    axes: ["byte i", "how often", "byte i+1"],
  },
  layers: {
    label: "Digraph over file",
    about: "The digraph stacked by position: bottom is the start of the file, top is the end. Sections of the file show up as layers.",
    axes: ["byte i", "position in file", "byte i+1"],
  },
};

// Counts every pair/triple; big inputs are sampled every `stride` bytes.
function tally(bytes, mode, maxSamples) {
  const starts = bytes.length - (mode === "tri" ? 2 : 1);
  const stride = Math.max(1, Math.ceil(starts / maxSamples));
  const counts = new Map(), first = new Map();
  for (let i = 0; i < starts; i += stride) {
    let key = bytes[i] << 8 | bytes[i + 1];
    if (mode === "tri") key = key << 8 | bytes[i + 2];
    else if (mode === "layers") key |= Math.floor(i * SLICES / starts) << 16;
    const seen = counts.get(key);
    if (seen === undefined) { counts.set(key, 1); first.set(key, i); }
    else counts.set(key, seen + 1);
  }
  return { counts, first, stride, starts };
}

// Where a key sits in the unit cube; `level` is its log-scaled count, 0..1.
function place(mode, key, level) {
  const hi = key >> 16 & 255, mid = key >> 8 & 255, lo = key & 255;
  if (mode === "tri") return [hi / 255, mid / 255, lo / 255];
  if (mode === "height") return [mid / 255, level, lo / 255];
  return [mid / 255, hi / (SLICES - 1), lo / 255];
}

function hue(h, light) {  // hsl with full saturation
  const f = n => { const k = (n + h * 12) % 12; return light - Math.min(light, 1 - light) * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
  return [f(0), f(8), f(4)];
}

// Point buffers for the tally; more than `maxPoints` keys are thinned to a random subset.
function cloud(t, mode, colourBy, minCount, maxPoints, random = Math.random) {
  const keys = [...t.counts].filter(([, n]) => n >= minCount);
  const unique = keys.length;
  if (unique > maxPoints) {
    for (let i = unique - 1; i > 0; i--) { const j = random() * (i + 1) | 0; [keys[i], keys[j]] = [keys[j], keys[i]]; }
    keys.length = maxPoints;
  }
  let max = 1;
  for (const [, n] of keys) if (n > max) max = n;
  const positions = new Float32Array(keys.length * 3), colours = new Float32Array(keys.length * 3);
  keys.forEach(([key, n], i) => {
    const level = Math.log(n + 1) / Math.log(max + 1);
    positions.set(place(mode, key, level).map(v => v - 0.5), i * 3);
    colours.set(colourBy === "where"
      ? hue(0.8 * t.first.get(key) / Math.max(1, t.starts), 0.55)   // red (start) → violet (end)
      : hue(0.66 - 0.66 * level, 0.25 + 0.4 * level), i * 3);       // blue (rare) → red (common)
  });
  return { positions, colours, unique, max };
}

// bin2bmp-style thumbnail: the file as a near-square greyscale image, sampled down to size×size RGBA.
function byteMap(bytes, size) {
  const px = new Uint8ClampedArray(size * size * 4);
  const width = Math.ceil(Math.sqrt(bytes.length)) || 1, height = Math.ceil(bytes.length / width) || 1;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const v = bytes[Math.floor(y * height / size) * width + Math.floor(x * width / size)] ?? 0;
    px.set([v, v, v, 255], (y * size + x) * 4);
  }
  return px;
}

function human(n) {
  for (const unit of ["bytes", "KB", "MB"]) { if (n < 1024 || unit === "MB") return (unit === "bytes" ? n : n.toFixed(1)) + " " + unit; n /= 1024; }
}

if (typeof module !== "undefined") module.exports = { MODES, tally, place, cloud, byteMap, human };
</script>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const MAX_SAMPLES = 4e6;   // pairs/triples counted per file
const MAX_POINTS = 400e3;  // points drawn
const THUMB = 112;
const AXIS_COLOURS = ["#ff6b6b", "#6bdb7a", "#6ba8ff"];
const $ = id => document.getElementById(id);

const files = [];
let current, mode = "tri", cached;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.01, 100);
camera.position.set(1.9, 1.3, 1.9);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 0.8;

scene.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1)), new THREE.LineBasicMaterial({ color: 0x444455 })));
AXIS_COLOURS.forEach((colour, axis) => {  // the three axes, from the corner where every value is 0
  const end = [-.5, -.5, -.5]; end[axis] = .5;
  const line = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-.5, -.5, -.5), new THREE.Vector3(...end)]);
  scene.add(new THREE.Line(line, new THREE.LineBasicMaterial({ color: colour })));
});
const material = new THREE.PointsMaterial({ size: 2, vertexColors: true, sizeAttenuation: false, transparent: true, opacity: 0.7, depthWrite: false });
const points = new THREE.Points(new THREE.BufferGeometry(), material);
scene.add(points);

function draw() {
  $("about").textContent = MODES[mode].about;
  $("legend").replaceChildren(...MODES[mode].axes.map((name, i) => {
    const span = document.createElement("span");
    span.textContent = "xyz"[i] + " = " + name; span.style.color = AXIS_COLOURS[i];
    return span;
  }));
  document.querySelectorAll(".file").forEach(card => card.classList.toggle("on", card.file === current));
  if (!current) { points.geometry.setDrawRange(0, 0); $("info").textContent = "Open or drop a file."; return; }

  if (cached?.file !== current || cached.mode !== mode) cached = { file: current, mode, tally: tally(current.bytes, mode, MAX_SAMPLES) };
  const c = cloud(cached.tally, mode, $("colour").value, +$("min").value, MAX_POINTS);
  points.geometry.dispose();
  points.geometry = new THREE.BufferGeometry();
  points.geometry.setAttribute("position", new THREE.BufferAttribute(c.positions, 3));
  points.geometry.setAttribute("color", new THREE.BufferAttribute(c.colours, 3));
  const what = mode === "tri" ? "triples" : mode === "height" ? "pairs" : "pairs × layers";
  $("info").textContent = [
    `${c.unique.toLocaleString()} distinct ${what}` + (c.unique > MAX_POINTS ? ` (showing ${MAX_POINTS / 1e3}k)` : ""),
    `most common: ${c.max.toLocaleString()}×`,
    cached.tally.stride > 1 ? `large file: only 1 in ${cached.tally.stride} positions counted` : "",
  ].filter(Boolean).join("\n");
}

// Card with a preview: the picture itself if the browser can decode it, otherwise a byte map.
async function addFile(name, bytes) {
  const file = { name, bytes };
  const card = document.createElement("div"), canvas = document.createElement("canvas"), meta = document.createElement("div");
  const title = document.createElement("div"), sub = document.createElement("div"), remove = document.createElement("button");
  card.className = "file"; card.file = file; meta.className = "meta"; title.className = "name"; sub.className = "sub"; remove.className = "remove";
  canvas.width = canvas.height = THUMB;
  title.textContent = title.title = name; remove.textContent = "×"; remove.title = "Remove";
  meta.append(title, sub); card.append(canvas, meta, remove);
  const ctx = canvas.getContext("2d");
  try {
    const picture = await createImageBitmap(new Blob([bytes]));
    const scale = Math.min(THUMB / picture.width, THUMB / picture.height);
    const w = picture.width * scale, h = picture.height * scale;
    canvas.style.imageRendering = "auto";
    ctx.drawImage(picture, (THUMB - w) / 2, (THUMB - h) / 2, w, h);
    sub.textContent = `${human(bytes.length)} · image ${picture.width}×${picture.height}`;
  } catch {
    ctx.putImageData(new ImageData(byteMap(bytes, THUMB), THUMB), 0, 0);
    sub.textContent = `${human(bytes.length)} · byte map`;
  }
  card.onclick = () => { current = file; draw(); };
  remove.onclick = event => {
    event.stopPropagation();
    files.splice(files.indexOf(file), 1); card.remove();
    if (current === file) current = files[0];
    draw();
  };
  files.push(file); $("files").append(card);
  return file;
}

async function openFiles(list) {
  let last;
  for (const f of list) last = await addFile(f.name, new Uint8Array(await f.arrayBuffer()));
  if (last) { current = last; draw(); }
}

for (const [id, m] of Object.entries(MODES)) {
  const button = document.createElement("button");
  button.textContent = m.label; button.classList.toggle("on", id === mode);
  button.onclick = () => { mode = id; [...$("modes").children].forEach(b => b.classList.toggle("on", b === button)); draw(); };
  $("modes").append(button);
}
$("rot").onclick = () => { controls.autoRotate = !controls.autoRotate; $("rot").classList.toggle("on", controls.autoRotate); };
$("size").oninput = () => material.size = +$("size").value;
$("min").onchange = $("colour").onchange = draw;
$("open").onclick = () => $("file").click();
$("file").onchange = () => openFiles($("file").files);
addEventListener("dragover", e => { e.preventDefault(); $("drop").style.display = "flex"; });
addEventListener("dragleave", e => { if (!e.relatedTarget) $("drop").style.display = "none"; });
addEventListener("drop", e => { e.preventDefault(); $("drop").style.display = "none"; openFiles(e.dataTransfer.files); });

function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
(function loop() { controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop); })();

// Built-in samples so there is something to look at before a file is opened.
const noise = new Uint8Array(200_000);
for (let i = 0; i < noise.length; i += 65536) crypto.getRandomValues(noise.subarray(i, i + 65536));
const signal = noise.map((n, i) => 128 + 70 * Math.sin(i / 40) + 40 * Math.sin(i / 7.3) + (n & 7) - 4);
current = await addFile("this page (text)", new TextEncoder().encode(document.documentElement.outerHTML));
await addFile("smooth signal (like raw audio or pixels)", signal);
await addFile("random bytes (like encrypted data)", noise);
draw();
</script>
</body>
</html>
