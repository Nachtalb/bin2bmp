[package]
name = "bin2bmp-viewer"
version = "0.1.0"
edition = "2021"
description = "3D byte graphs of any file"

[dependencies]
bin2bmp = { version = "0.2.0", path = ".." }
eframe = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
rfd = "0.18.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.80"
